<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Shopping List — Add Item</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Smart Shopping List</h1>
    <nav>
      <a href="index.html">List</a>
      <a href="add.html" class="active">Add Item</a>
      <a href="pantry.html">Pantry</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Add New Item</h2>
      <form id="add-form" novalidate>
        <label>
          Name  
          <input id="item-name" type="text" required>
          <span class="error" id="error-name"></span>
        </label>
        <label>
          Category  
          <select id="item-category" required>
            <option value="">— Select Category —</option>
            <option>Produce</option>
            <option>Dairy</option>
            <option>Bakery</option>
            <option>Meat</option>
            <option>Pantry</option>
          </select>
          <span class="error" id="error-category"></span>
        </label>
        <label>
          Quantity  
          <input id="item-qty" type="number" min="1" value="1" required>
          <span class="error" id="error-qty"></span>
        </label>
        <label>
          Notes  
          <textarea id="item-notes" rows="2"></textarea>
        </label>
        <button type="submit">Add to List</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Smart Shopping List</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
